---
apiVersion: apps/v1
kind: Deployment
metadata:
  name : mydeployment
spec:
  replicas : 2
  selector:
    matchLabels:
      app: swiggy
  template:
    metadata:
      labels:
          app: swiggy
    spec:
      containers:
        - name: cont-1
          image: chandrika11499/k8project2:app-image
          ports:
            - containerPort: 80

          envFrom:
            - configMapRef:
                name: myconfigmap

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10 
        
